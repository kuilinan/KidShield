name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Decode release keystore
        run: |
          base64 -d kidshield-release.keystore.b64 > app/kidshield-release.keystore
      - name: Build release APK
        env:
          KEYSTORE_FILE: kidshield-release.keystore
          KEYSTORE_PASS: KidShield@2026!
          KEY_ALIAS: kidshield
          KEY_PASS: KidShield@2026!
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kidshield-apk
          path: app/build/outputs/apk/release/*.apk
